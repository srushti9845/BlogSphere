{% extends "base.html" %}
{% block title %}Log in · BlogSphere{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro"><span class="eyebrow">WELCOME BACK</span><h1>Your next great idea starts here.</h1><p>Sign in to publish stories and join the conversation.</p></div>
  <form class="form-card" method="post">
    <h2>Log in</h2><p class="muted">Welcome back to BlogSphere.</p>
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button button-full" type="submit">Log in</button>
    <p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
